name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["android-v*"]
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    # Сборка не на Pi: Gradle съедает всю память Raspberry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Сборка debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: omnisecretary-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          name: "OmniSecretary ${{ github.ref_name }}"
          body: |
            Debug-сборка Android-клиента OmniSecretary.
            Установка: разрешить установку из неизвестных источников и открыть APK.

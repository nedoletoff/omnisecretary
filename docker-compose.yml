# OmniSecretary — базовый стек (этап 1)
#
# Все версии образов зафиксированы. Обновление — только осознанно, через
# scripts/update.sh и правку тега здесь (см. docs/decisions.md).
#
# Профиль памяти рассчитан на Raspberry Pi 4 / 4 ГБ:
#   nginx 32M + open-webui 1280M + postgres 384M + qdrant 512M + redis 64M
#   + vikunja 192M + portal 96M
#
# Запуск: make up  (или docker compose up -d)

name: omnisecretary

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─────────────────────────────────────────────────────────────
  # Reverse proxy: единственная точка входа снаружи.
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.30.6-alpine
    container_name: omni-nginx
    restart: unless-stopped
    depends_on:
      open-webui:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      # Vikunja (задачи). Только LAN, наружу не пробрасывать.
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot:ro
      # Сертификаты Let's Encrypt (выпуск/продление — scripts/renew-certs.sh).
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 32m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Ядро: Open WebUI. Один бэкенд для веба, Telegram и API.
  # ─────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────
  # LLM-шлюз: OpenRouter с откатом на бесплатную модель.
  # Open WebUI ходит сюда как в обычный OpenAI API; если у OpenRouter
  # кончился баланс или ключ отозван — отвечает бесплатная модель.
  # ─────────────────────────────────────────────────────────────
  llm-gateway:
    image: omnisecretary-mcp:local
    container_name: omni-llm-gateway
    command: ["uvicorn", "gateway:app", "--host", "0.0.0.0", "--port", "8080",
              "--app-dir", "/app/llm"]
    restart: unless-stopped
    environment:
      OPENROUTER_KEY: ${OPENROUTER_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_BASE: ${OPENROUTER_BASE:-https://openrouter.ai/api/v1}
      FALLBACK_BASE: ${FALLBACK_BASE:-https://text.pollinations.ai/openai}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-openai-fast}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # OpenRouter отвечает «Access denied by security policy» с российского
      # IP, поэтому шлюз ходит через VPN. Локальные адреса — напрямую.
      HTTPS_PROXY: http://vpn:2080
      HTTP_PROXY: http://vpn:2080
      NO_PROXY: localhost,127.0.0.1,llm-gateway
    volumes:
      - ./llm:/app/llm:ro
    networks:
      - backend
    ports:
      # Только для smoke-тестов с хоста; в LAN и наружу не выставлен.
      - "127.0.0.1:8088:8080"
    mem_limit: 96m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    container_name: omni-open-webui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      # ── База данных ──
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_SIZE: "5"
      DATABASE_ENABLE_SESSION_SHARING: "False"

      # ── Векторная память (Qdrant, векторы на диске — экономия RAM) ──
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_ON_DISK: "true"
      QDRANT_PREFER_GRPC: "false"

      # ── Эмбеддинги: только облако, локальные модели на Pi не запускаем ──
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: ${EMBEDDING_API_BASE_URL}
      RAG_OPENAI_API_KEY: ${EMBEDDING_API_KEY}
      RAG_EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      RAG_EMBEDDING_BATCH_SIZE: "16"
      ENABLE_RAG_HYBRID_SEARCH: "false"
      RAG_FILE_MAX_SIZE: "50"

      # ── Основная LLM (OpenAI-совместимый облачный API) ──
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENABLE_OLLAMA_API: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"

      # ── Веб-сокеты и сессии (общие между вкладками и сервисами) ──
      WEBSOCKET_MANAGER: redis
      WEBSOCKET_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # ── Безопасность и доступ ──
      WEBUI_AUTH: "true"
      # Только свой домен и LAN: без CORS «*».
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-https://nedoletoff.sknt.ru}
      # Токен живёт 30 дней, а не вечно.
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2592000}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_URL: ${WEBUI_URL}
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: "user"
      # API-ключи нужны скриптам (импорт пресетов, бэкапы).
      ENABLE_API_KEYS: ${ENABLE_API_KEYS:-true}
      # MCP-инструменты как внешние сервисы (mcp-* в этом же compose).
      ENABLE_TOOL_SERVERS: "true"
      # Голос: локальные Vosk STT и Silero TTS (профиль voice).
      # Если контейнеры не запущены, микрофон/озвучка вернут ошибку — это ок.
      AUDIO_STT_ENGINE: ${AUDIO_STT_ENGINE:-openai}
      AUDIO_STT_OPENAI_API_BASE_URL: http://stt:8000/v1
      AUDIO_STT_OPENAI_API_KEY: local
      AUDIO_STT_MODEL: vosk
      AUDIO_TTS_ENGINE: ${AUDIO_TTS_ENGINE:-openai}
      AUDIO_TTS_OPENAI_API_BASE_URL: ${AUDIO_TTS_OPENAI_API_BASE_URL:-http://tts:8000/v1}
      AUDIO_TTS_OPENAI_API_KEY: local
      AUDIO_TTS_MODEL: tts
      AUDIO_TTS_VOICE: ${TTS_DEFAULT_VOICE:-baya}
      # Права пользователей по умолчанию: без шаринга чатов/заметок.
      USER_PERMISSIONS_FEATURES_API_KEYS: "true"
      USER_PERMISSIONS_CHAT_SHARE: "false"
      USER_PERMISSIONS_FEATURES_CHANNELS: "false"
      USER_PERMISSIONS_NOTES_ALLOW_SHARING: "false"
      USER_PERMISSIONS_FOLDERS_ALLOW_SHARING: "false"
      ENABLE_OPENAI_API: "true"
      ENABLE_COMMUNITY_SHARING: "false"

      # ── Приватность и телеметрия ──
      ANONYMIZED_TELEMETRY: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"

      # ── Прочее ──
      WEBUI_NAME: "OmniSecretary"
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru-RU}
      # Модели, видимые по умолчанию; первая — основная (OmniSecretary).
      DEFAULT_MODELS: ${DEFAULT_MODELS:-}
      GLOBAL_LOG_LEVEL: "INFO"
      # Веб-поиск: DuckDuckGo через ddgs (проверен с Pi, ~10 с на запрос).
      # Модели с capabilities.web_search=true получают поиск в чате.
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: ${WEB_SEARCH_ENGINE:-duckduckgo}
      WEB_SEARCH_RESULT_COUNT: "3"
      WEB_SEARCH_CONCURRENT_REQUESTS: "1"
      WEB_SEARCH_TRUST_ENV: "false"
      TZ: ${TZ:-UTC}
    volumes:
      - openwebui_data:/app/backend/data
      # Тема Gruvbox. index.html подключает /static/custom.css до бандла;
      # статика раздаётся из /app/build/static (backend копирует её туда
      # при старте, поэтому монтировать в оба каталога нельзя — падает
      # с «are the same file»).
      - ./theme/gruvbox.css:/app/build/static/custom.css:ro
    # Порт наружу не публикуем: доступ только через nginx.
    # Для отладки с хоста раскомментируйте строку ниже.
    # ports:
    #   - "127.0.0.1:3000:8080"
    networks:
      - frontend
      - backend
      - mcp
      # Нужна, чтобы Open WebUI вызывал MCP песочницы; сама песочница
      # к backend-сервисам доступа не имеет.
      - sandbox
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s
    mem_limit: 2048m
    memswap_limit: 2560m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL (+pgvector как резервный векторный бэкенд)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: omni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Qdrant — векторная память
  # ─────────────────────────────────────────────────────────────
  qdrant:
    # v1.19.x выровнен с qdrant-client 1.18.0 внутри Open WebUI v0.13.3:
    # разница минорных версий ≤ 1, клиент не ругается на несовместимость.
    image: qdrant/qdrant:v1.19.2
    container_name: omni-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    # Только localhost: нужен для бэкапов (snapshot API) и smoke-тестов.
    ports:
      - "127.0.0.1:6333:6333"
    networks:
      - backend
    healthcheck:
      # В образе Qdrant есть bash; проверяем доступность HTTP-порта.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Redis — веб-сокеты и кэш сессий (не хранилище данных)
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:8.8.4-alpine
    container_name: omni-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60 1"
      - --loglevel
      - warning
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Одноразовая инициализация дополнительных БД (Vikunja).
  # Отдельная база в том же PostgreSQL — экономим ~150 МБ ОЗУ,
  # которые потребовал бы второй сервер БД.
  # ─────────────────────────────────────────────────────────────
  db-init:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: omni-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      EXTRA_DATABASES: "vikunja"
    volumes:
      - ./docker/db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/bash", "/db-init.sh"]
    networks:
      - backend
    mem_limit: 128m
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Vikunja — задачи и проекты (список дел на естественном языке).
  # Отдельный порт 8081: Vikunja не умеет жить в подкаталоге.
  # CalDAV включён — задачи с датами видны в календарях на телефоне.
  # ─────────────────────────────────────────────────────────────
  vikunja:
    image: vikunja/vikunja:2.8.0
    container_name: omni-vikunja
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SECRET}
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_PUBLIC_URL}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      VIKUNJA_SERVICE_ENABLECALDAV: "true"
      VIKUNJA_SERVICE_TIMEZONE: ${TZ:-UTC}
      VIKUNJA_SERVICE_MAXITEMSPERPAGE: "50"
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: postgres
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: ${POSTGRES_USER}
      VIKUNJA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      VIKUNJA_DATABASE_SSLMODE: disable
      VIKUNJA_DATABASE_MAXOPENCONNECTIONS: "5"
      VIKUNJA_FILES_BASEPATH: /app/vikunja/files
      VIKUNJA_MAILER_ENABLED: "false"
      VIKUNJA_LOG_LEVEL: INFO
      TZ: ${TZ:-UTC}
    volumes:
      - vikunja_data:/app/vikunja/files
    networks:
      # frontend — чтобы nginx мог проксировать; backend — доступ к postgres.
      - frontend
      - backend
      - mcp
    # Healthcheck намеренно отсутствует: образ distroless (нет shell/curl),
    # а встроенная команда `vikunja healthcheck` прогоняет миграции при каждом
    # вызове. Доступность проверяет scripts/smoke-test.sh через nginx :8081.
    mem_limit: 192m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # VPN-прокси: Xray-core (VLESS/xhttp+reality) + HTTP/SOCKS inbound.
  # Приложения получают HTTPS_PROXY=http://vpn:2080 и ходят в интернет
  # через VPN; локальные сервисы (postgres, qdrant, open-webui) — напрямую
  # через NO_PROXY. Обновления хоста (apt, docker pull) VPN не затрагивают.
  # Конфиг генерирует scripts/vpn-config.py из подписки VPN_KEY.
  # ─────────────────────────────────────────────────────────────
  vpn:
    # Xray-core: провайдер отдаёт VLESS поверх xhttp+reality,
    # sing-box такие транспорты не поддерживает.
    image: teddysun/xray:26.11.9
    container_name: omni-vpn
    restart: unless-stopped
    command: ["/usr/bin/xray", "run", "-c", "/etc/xray/config.json"]
    volumes:
      - ${DATA_ROOT}/vpn/config.json:/etc/xray/config.json:ro
    networks:
      - backend
    ports:
      # Только localhost — для проверок и мониторинга с хоста.
      - "127.0.0.1:2080:2080"
      - "127.0.0.1:2081:2081"
    mem_limit: 96m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Портал: регистрация по инвайт-токену, вход по логину и личные
  # настройки (город, GitHub-токен, пресет). Аккаунты создаются в
  # Open WebUI через админский API — один бэкенд, одни чаты.
  # ─────────────────────────────────────────────────────────────
  portal:
    image: omnisecretary-mcp:local
    container_name: omni-portal
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000",
              "--app-dir", "/app/portal"]
    restart: unless-stopped
    depends_on:
      open-webui:
        condition: service_healthy
    environment:
      OWUI_URL: http://open-webui:8080
      SECRETS_DIR: /secrets
      PORTAL_DATA: /data
      BOT_DB_PATH: /bot/bot.db
      PORTAL_SECRET: ${PORTAL_SECRET:-}
      PORTAL_OWNER: ${WEBUI_ADMIN_EMAIL:-}
      STATUS_FILE: /status/device.json
      REGISTER_TOKEN: ${REGISTER_TOKEN:-}
      TELEGRAM_CONFIRM_CODE: ${TELEGRAM_CONFIRM_CODE:-}
      WEATHER_CITY: ${WEATHER_CITY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./portal:/app/portal:ro
      - ${DATA_ROOT}/portal:/data
      - ${DATA_ROOT}/secrets:/secrets:ro
      - ${DATA_ROOT}/bot:/bot
      - ${DATA_ROOT}/status:/status:ro
    networks: [frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 96m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── Telegram-бот: второе окно к тому же бэкенду ─────────────────────────
  # Запускается отдельным профилем: docker compose --profile telegram up -d
  # (make tg-up). Без TELEGRAM_BOT_TOKEN не стартует — так и задумано.
  telegram-bot:
    image: python:3.12-slim
    profiles: ["telegram"]
    container_name: omni-telegram-bot
    command: ["python", "-u", "/app/telegram_bot.py"]
    restart: unless-stopped
    depends_on:
      open-webui:
        condition: service_healthy
      vpn:
        condition: service_started
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      TELEGRAM_OPEN_ACCESS: ${TELEGRAM_OPEN_ACCESS:-false}
      TELEGRAM_CONFIRM_CODE: ${TELEGRAM_CONFIRM_CODE:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TELEGRAM_ACCOUNT_MAP: ${TELEGRAM_ACCOUNT_MAP:-}
      TELEGRAM_DEFAULT_MODEL: ${TELEGRAM_DEFAULT_MODEL:-secretary}
      WEATHER_LAT: ${WEATHER_LAT:-}
      WEATHER_LON: ${WEATHER_LON:-}
      WEATHER_CITY: ${WEATHER_CITY:-}
      OWUI_INTERNAL_URL: http://open-webui:8080
      # VPN: api.telegram.org и погода — через прокси, OWUI — напрямую.
      HTTPS_PROXY: http://vpn:2080
      HTTP_PROXY: http://vpn:2080
      NO_PROXY: open-webui,postgres,qdrant,redis,vikunja,vpn,localhost,127.0.0.1
      DATA_ROOT: /srv/omnisecretary
      TZ: ${TZ:-UTC}
    volumes:
      - ./bot:/app:ro
      - ${DATA_ROOT}/bot:/srv/omnisecretary/bot
      - ${DATA_ROOT}/secrets:/srv/omnisecretary/secrets:ro
    networks:
      - backend
    mem_limit: 96m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── MCP-серверы: инструменты как отдельные контейнеры ───────────────────
  # Доступ: tool server без access_grants = только администратор (владелец).
  # Сеть backend — снаружи недоступны, порты не публикуются.
  mcp-vault:
    build: ./mcp
    image: omnisecretary-mcp:local
    container_name: omni-mcp-vault
    command: ["python", "/app/servers/vault.py"]
    restart: unless-stopped
    environment:
      VAULT_DIR: /vault
      VAULT_INDEX_PATH: /index/vault.db
      VAULT_WRITE_PREFIX: ${VAULT_WRITE_PREFIX:-AI}
      VAULT_TOKEN_FILE: /secrets/vault-git-token
      VAULT_PUSH_ENABLED: ${VAULT_PUSH_ENABLED:-true}
      MCP_PORT: "8000"
    volumes:
      - ./mcp/servers:/app/servers:ro
      - ${DATA_ROOT}/vault:/vault
      - ${DATA_ROOT}/vault-index:/index
      - ${DATA_ROOT}/secrets:/secrets:ro
    networks: [mcp]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8000),2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mcp-files:
    image: omnisecretary-mcp:local
    container_name: omni-mcp-files
    command: ["python", "/app/servers/files.py"]
    restart: unless-stopped
    environment:
      SHARED_DIR: /shared
      MCP_PORT: "8000"
    volumes:
      - ./mcp/servers:/app/servers:ro
      - ${DATA_ROOT}/shared:/shared
    networks: [mcp]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8000),2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mcp-github:
    image: omnisecretary-mcp:local
    container_name: omni-mcp-github
    command: ["python", "/app/servers/github.py"]
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WRITE_ENABLED: ${GITHUB_WRITE_ENABLED:-false}
      MCP_PORT: "8000"
    volumes:
      - ./mcp/servers:/app/servers:ro
    networks: [mcp]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8000),2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 96m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mcp-vikunja:
    image: omnisecretary-mcp:local
    container_name: omni-mcp-vikunja
    command: ["python", "/app/servers/vikunja.py"]
    restart: unless-stopped
    depends_on:
      vikunja:
        condition: service_started
    environment:
      VIKUNJA_URL: http://vikunja:3456
      VIKUNJA_API_TOKEN: ${VIKUNJA_API_TOKEN:-}
      MCP_PORT: "8000"
    volumes:
      - ./mcp/servers:/app/servers:ro
    networks: [mcp]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8000),2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Песочница: код и прототипы. Без Docker-сокета и без доступа к хосту.
  mcp-sandbox:
    image: omnisecretary-mcp:local
    container_name: omni-mcp-sandbox
    command: ["python", "/app/servers/shell.py"]
    restart: unless-stopped
    environment:
      SANDBOX_DIR: /workspace
      SANDBOX_TIMEOUT: "60"
      MCP_PORT: "8000"
    volumes:
      - ./mcp/servers:/app/servers:ro
      - ${DATA_ROOT}/sandbox:/workspace
    # Своя сеть: интернет для pip/npm есть, доступа к postgres, Qdrant,
    # Redis, Vikunja и MCP-серверам с секретами — нет.
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8000),2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 192m
    pids_limit: 128
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Веб-форма подключения вольта. Только LAN, Basic Auth.
  vault-manager:
    image: omnisecretary-mcp:local
    container_name: omni-vault-manager
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000",
              "--app-dir", "/app/vault_manager"]
    restart: unless-stopped
    environment:
      VAULT_DIR: /vault
      SECRETS_DIR: /secrets
      VAULT_BRANCH: ${VAULT_BRANCH:-main}
      VAULT_ADMIN_USER: ${VAULT_ADMIN_USER:-owner}
      VAULT_ADMIN_PASSWORD: ${VAULT_ADMIN_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./mcp:/app:ro
      - ${DATA_ROOT}/vault:/vault
      - ${DATA_ROOT}/secrets:/secrets
    networks: [frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 96m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── Голос: Vosk STT + Silero TTS (профиль voice) ───────────────────────
  # Отдельные контейнеры: локальные модели не должны жить в ядре.
  stt:
    build: ./voice/stt
    image: omnisecretary-stt:local
    container_name: omni-stt
    profiles: ["voice"]
    restart: unless-stopped
    environment:
      VOSK_MODEL_PATH: /models/vosk
      STT_MODEL_DIR: /models/vosk
      STT_LANGUAGE: ru
      STT_THREADS: "4"
      TZ: ${TZ:-UTC}
    networks: [backend]
    mem_limit: 320m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  tts:
    build: ./voice/tts
    image: omnisecretary-tts:local
    container_name: omni-tts
    profiles: ["voice"]
    restart: unless-stopped
    environment:
      TTS_BACKEND: silero
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-baya}
      TTS_SAMPLE_RATE: "48000"
      TZ: ${TZ:-UTC}
    networks: [backend]
    # torch + модель Silero: ~350 МБ в работе.
    mem_limit: 640m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Лёгкая альтернатива: Piper (onnxruntime). Профиль voice-piper.
  tts-piper:
    build:
      context: ./voice/tts
      dockerfile: Dockerfile.piper
    image: omnisecretary-tts-piper:local
    container_name: omni-tts-piper
    profiles: ["voice-piper"]
    restart: unless-stopped
    environment:
      TTS_BACKEND: piper
      TZ: ${TZ:-UTC}
    networks: [backend]
    mem_limit: 192m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── Проактивность: утренний брифинг в Telegram (профиль proactive) ─────
  proactive:
    build: ./proactive
    image: omnisecretary-proactive:local
    container_name: omni-proactive
    profiles: ["proactive"]
    restart: unless-stopped
    environment:
      BRIEFING_TZ: ${TZ:-Europe/Moscow}
      BRIEFING_TIME: ${BRIEFING_TIME:-07:30}
      WEBUI_BASE_URL: http://open-webui:8080
      WEBUI_API_KEY: ${WEBUI_API_KEY:-}
      VIKUNJA_BASE_URL: http://vikunja:3456
      VIKUNJA_API_TOKEN: ${VIKUNJA_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      WEATHER_LAT: ${WEATHER_LAT:-}
      WEATHER_LON: ${WEATHER_LON:-}
      WEATHER_CITY: ${WEATHER_CITY:-}
      VAULT_DIR: /vault
      BOT_DB_PATH: /data/bot/bot.db
      HTTPS_PROXY: http://vpn:2080
      HTTP_PROXY: http://vpn:2080
      NO_PROXY: open-webui,vikunja,vpn,localhost,127.0.0.1
    volumes:
      - ${DATA_ROOT}/vault:/vault:ro
      - ${DATA_ROOT}/bot:/data/bot:ro
      - proactive_state:/state
    networks:
      - backend
    mem_limit: 96m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  # nginx ↔ open-webui
  frontend:
    driver: bridge
  # open-webui ↔ postgres/qdrant/redis. Наружу не выходит.
  backend:
    driver: bridge
  # open-webui ↔ MCP-серверы. Песочницы здесь нет: prompt injection
  # из shell не должен дотянуться до GitHub-токена и вольта.
  mcp:
    driver: bridge
  # Песочница: только внешний интернет, никаких внутренних сервисов.
  sandbox:
    driver: bridge

volumes:
  # Тома привязаны к каталогам на диске данных (DATA_ROOT),
  # чтобы бэкап и перенос на внешний HDD были предсказуемыми.
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT}/volumes/postgres
  qdrant_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT}/volumes/qdrant
  qdrant_snapshots:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT}/volumes/qdrant-snapshots
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT}/volumes/redis
  openwebui_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT}/volumes/openwebui
  vikunja_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT}/volumes/vikunja
  proactive_state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT}/volumes/proactive
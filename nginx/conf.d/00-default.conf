# HTTP-вход (LAN и Cloudflare Tunnel).
# Для внешнего доступа без открытых портов: cloudflared tunnel --url http://127.0.0.1:80
# Для HTTPS напрямую: см. 10-ssl.conf.example

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Healthcheck для docker и smoke-тестов.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ACME (Let's Encrypt webroot). Каталог смонтирован из ./nginx/www.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Подключение вольта: /vault/ → vault-manager. Только LAN.
    location = /vault {
        return 301 /vault/;
    }

    location /vault/ {
        include /etc/nginx/snippets/redirect-https.conf;
        set $vaultmanager_upstream http://vault-manager:8000;
        # Отрезаем префикс /vault/ — сервис живёт в корне.
        rewrite ^/vault/(.*)$ /$1 break;
        proxy_pass $vaultmanager_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Портал: регистрация по токену, вход, личные настройки.
    location = /register {
        return 301 /portal/register;
    }

    location /portal/ {
        include /etc/nginx/snippets/redirect-https.conf;
        set $portal_upstream http://portal:8000;
        rewrite ^/portal/(.*)$ /$1 break;
        proxy_pass $portal_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Мобильный API (приложение): Bearer-токен, аудио до 12 МБ.
    location /api/m/ {
        client_max_body_size 12m;
        set $portal_upstream http://portal:8000;
        proxy_pass $portal_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location / {
        include /etc/nginx/snippets/redirect-https.conf;
        include /etc/nginx/snippets/proxy.conf;
    }
}

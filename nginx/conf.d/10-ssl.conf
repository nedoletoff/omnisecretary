# HTTPS для внешнего домена (Let's Encrypt).
# Сертификаты выпущены certbot в /etc/letsencrypt и смонтированы в контейнер.
# Продление: scripts/renew-certs.sh (см. docs/router.md).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nedoletoff.sknt.ru;

    ssl_certificate     /etc/nginx/certs/nedoletoff.sknt.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/nedoletoff.sknt.ru/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS включаем только когда HTTPS стабильно работает снаружи.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Подключение вольта (только владелец, Basic Auth в vault-manager).
    location = /vault {
        return 301 /vault/;
    }

    location /vault/ {
        set $vaultmanager_upstream http://vault-manager:8000;
        rewrite ^/vault/(.*)$ /$1 break;
        proxy_pass $vaultmanager_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Все входы в систему — только через наш портал, а не родной экран Open WebUI.
    location = /login {
        return 301 /portal/login;
    }

    location = /signin {
        return 301 /portal/login;
    }

    location = /register {
        return 301 /portal/register;
    }

    # Корень Open WebUI открываем только после входа в портал:
    # без cookie показываем нормальную форму входа, а не чёрный экран ядра.
    location = / {
        if ($cookie_portal_session = "") {
            return 302 /portal/login;
        }
        include /etc/nginx/snippets/proxy.conf;
    }

    location /portal/ {
        set $portal_upstream http://portal:8000;
        rewrite ^/portal/(.*)$ /$1 break;
        proxy_pass $portal_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Мобильный API (приложение): Bearer-токен, аудио до 12 МБ.
    location /api/m/ {
        client_max_body_size 12m;
        set $portal_upstream http://portal:8000;
        proxy_pass $portal_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
    }
}

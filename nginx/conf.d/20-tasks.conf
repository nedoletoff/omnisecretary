# Vikunja — задачи и проекты.
#
# Отдельный порт 8081, а не путь /tasks/: Vikunja не поддерживает работу
# из подкаталога (её API и фронтенд живут в корне).
# Когда появится домен — заменить на server_name tasks.<домен> с TLS.
#
# Порт публикуется только в LAN (проброс на роутере не делать).

server {
    listen 8081;
    server_name _;

    # Вложения к задачам.
    client_max_body_size 32m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $vikunja_upstream http://vikunja:3456;
        proxy_pass $vikunja_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}

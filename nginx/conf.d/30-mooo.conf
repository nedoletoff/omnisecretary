# Быстрый доступ к календарю и заметкам: nedoletoff.mooo.com
# Только портал (вход теми же аккаунтами Open WebUI), без чата и админки.
# Отдельный домен удобен для закладки на телефоне и PWA.

server {
    listen 80;
    listen [::]:80;
    server_name nedoletoff.mooo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nedoletoff.mooo.com;

    ssl_certificate     /etc/nginx/certs/nedoletoff.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/nedoletoff.mooo.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 301 https://nedoletoff.sknt.ru/portal/workspace;
    }

    # Один рабочий домен: все разделы и приложение используют один адрес.
    location / {
        return 301 https://nedoletoff.sknt.ru$request_uri;
    }
}

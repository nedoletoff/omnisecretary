# Единая панель навигации OmniSecretary поверх веб-интерфейса.
# Добавляется в HTML Open WebUI без правки его исходников и брендинга.
# Open WebUI отдаёт сжатый HTML — sub_filter работает только с несжатым телом.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '</head>' '<style>
.omni-dock{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:2147483000;display:flex;align-items:center;gap:2px;padding:6px 8px;max-width:calc(100vw - 20px);background:rgba(40,40,40,.94);border:1px solid #fabd2f;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(10px)}
.omni-dock a{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;color:#ebdbb2;text-decoration:none;font:600 12px/1 system-ui,-apple-system,sans-serif;white-space:nowrap}
.omni-dock a:hover{background:#504945;color:#fabd2f}
.omni-dock img{width:20px;height:20px;flex:none}
.omni-dock .brand{display:flex;align-items:center;gap:7px;padding-right:10px;margin-right:2px;border-right:1px solid #504945;color:#fabd2f;font-weight:700}
@media(max-width:820px){.omni-dock{bottom:6px;max-width:calc(100vw - 12px);overflow-x:auto}.omni-dock a{padding:7px 8px;font-size:11px}.omni-dock .brand span{display:none}}
</style>
<script>
(function(){
  function mount(){
    if(document.querySelector(".omni-dock"))return;
    var bar=document.createElement("div");
    bar.className="omni-dock";
    bar.innerHTML="<a class=brand href=/portal/workspace title=\"OmniSecretary\"><img src=/omni-logo.svg alt=OmniSecretary><span>OmniSecretary</span></a>"+
      "<a href=/ title=\"Чат\">Чат</a>"+
      "<a href=/portal/workspace title=\"Главная\">Главная</a>"+
      "<a href=/portal/calendar title=\"Календарь\">Календарь</a>"+
      "<a href=/portal/tasks title=\"Задачи\">Задачи</a>"+
      "<a href=/portal/notes title=\"Заметки\">Заметки</a>"+
      "<a href=/portal/obsidian title=\"Obsidian\">Obsidian</a>"+
      "<a href=/portal/llm title=\"Модели и ключи\">Модели</a>"+
      "<a href=/portal/account title=\"Настройки\">Настройки</a>";
    document.body.appendChild(bar);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mount);else mount();
})();
</script></head>';

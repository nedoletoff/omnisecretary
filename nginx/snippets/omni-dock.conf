# Внедрение OmniSecretary в интерфейс Open WebUI.
# Только тема и боковое меню: нижняя панель убрана, чтобы не появлялась
# на страницах логина/регистрации и в служебных разделах.
proxy_set_header Accept-Encoding "";
sub_filter_once off;
sub_filter '</head>' '<link rel="stylesheet" href="/static/custom.css"><script src="/omni-inject.js" defer></script></head>';

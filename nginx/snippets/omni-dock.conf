# Внедрение OmniSecretary в интерфейс Open WebUI.
proxy_set_header Accept-Encoding "";
sub_filter_once off;
sub_filter_types text/html;
# Подключаем тему и скрипт внедрения в head.
sub_filter '</head>' '<link rel="stylesheet" href="/static/custom.css"><script src="/omni-inject.js" defer></script></head>';
# Нижняя панель как запасной вариант, если сайдбар скрыт.
sub_filter '</body>' '<nav class="omni-dock" aria-label="Навигация OmniSecretary"><a class="omni-brand" href="/portal/workspace" title="OmniSecretary"><img src="/omni-logo.svg" alt="OmniSecretary"><span>OmniSecretary</span></a><a href="/" title="Чат">Чат</a><a href="/portal/workspace" title="Главная">Главная</a><a href="/portal/calendar" title="Календарь">Календарь</a><a href="/portal/tasks" title="Задачи">Задачи</a><a href="/portal/notes" title="Заметки">Заметки</a><a href="/portal/obsidian" title="Obsidian">Obsidian</a><a href="/portal/search" title="Поиск">Поиск</a><a href="/portal/llm" title="Модели">Модели</a><a href="/#/settings" title="Настройки Open WebUI">Настройки</a></nav><style>.omni-dock{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:2147483000;display:flex;align-items:center;gap:2px;padding:6px 8px;max-width:calc(100vw - 20px);background:rgba(40,40,40,.97);border:1px solid #fabd2f;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}.omni-dock a{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:9px;color:#ebdbb2;text-decoration:none;font:600 12px/1 system-ui,sans-serif;white-space:nowrap}.omni-dock a:hover{background:#504945;color:#fabd2f}.omni-dock img{width:20px;height:20px}.omni-dock .omni-brand{color:#fabd2f;border-right:1px solid #504945;margin-right:2px;padding-right:10px}@media(max-width:900px){.omni-dock{bottom:6px;max-width:calc(100vw - 12px);overflow-x:auto}.omni-dock a{padding:7px 8px;font-size:11px}.omni-dock .omni-brand span{display:none}}</style></body>';

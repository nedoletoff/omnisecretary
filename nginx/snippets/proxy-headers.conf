# Общие заголовки проксирования (без proxy_pass).
# Подключается в location, где нужен другой upstream.
# Сам proxy_pass задаётся в конкретном location или в snippets/proxy.conf.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Схему определяет сам nginx: клиентский заголовок подделывается.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket (карта $connection_upgrade — в nginx/nginx.conf).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# SSE/стриминг: не буферизуем ответ.
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;

# Долгие ответы моделей и генерация аудио.
proxy_connect_timeout 30s;
proxy_send_timeout    3600s;
proxy_read_timeout    3600s;

# Базовые заголовки безопасности. HSTS здесь, а не в server-блоке:
# add_header в location перекрывает унаследованный из server.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options        SAMEORIGIN always;
add_header Referrer-Policy        same-origin always;

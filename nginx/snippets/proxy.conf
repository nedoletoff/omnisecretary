# Проксирование к Open WebUI (ядро).
# Подключается через include /etc/nginx/snippets/proxy.conf;
#
# proxy_pass через переменную: nginx не кэширует IP контейнера,
# поэтому перезапуск open-webui не требует перезапуска nginx.

set $openwebui_upstream http://open-webui:8080;
proxy_pass $openwebui_upstream;

include /etc/nginx/snippets/proxy-headers.conf;

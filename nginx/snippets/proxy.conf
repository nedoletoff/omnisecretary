# Общие настройки проксирования к Open WebUI.
# Подключается через include /etc/nginx/snippets/proxy.conf;

proxy_pass http://openwebui;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# SSE/стриминг ответов LLM: не буферизуем ответ.
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;

# Долгие ответы моделей и генерация аудио.
proxy_connect_timeout 30s;
proxy_send_timeout    3600s;
proxy_read_timeout    3600s;

# Базовые заголовки безопасности (HSTS добавляется только в HTTPS-блоке).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options        SAMEORIGIN always;
add_header Referrer-Policy        same-origin always;
